about_stop1_p1: |-
  Sou licenciado em Engenharia Informática pelo Instituto Superior Politécnico Kangonjo (ISKA) e estou à procura de uma oportunidade na área de desenvolvimento de software.
about_stop1_p2: |-
  Durante a licenciatura consolidei conhecimentos sólidos em sistemas, redes e engenharia de software.
about_stop1_p3: |-
  Tudo começou na 11.ª classe, no curso de Ciências Físicas e Biológicas na Escola Nº 4073 – Padre Inácio Tambu (2016–2018), quando pedi emprestado a um colega o livro “Linguagem C” de Luís Damas — cujo pai havia estudado programação em Portugal. Entre leituras e exercícios práticos ao longo de algumas semanas, descobri o gosto pela programação.
