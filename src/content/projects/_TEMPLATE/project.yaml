# =============================================================================
# PASTA TEMPLATE DE NOVO PROJETO (Ignorada automaticamente porque começa com "_")
# =============================================================================
# COMO ADICIONAR UM NOVO PROJETO ISOLADO SEM MEXER NO CÓDIGO:
# 1. Duplica esta pasta `_TEMPLATE` dentro de `src/content/projects/`
#    e dá-lhe o nome do teu projeto (ex: `08-meu-novo-projeto/`).
# 2. Coloca todas as imagens do projeto (capa, capturas de ecrã, etc.)
#    diretamente dentro dessa mesma subpasta ao lado deste `project.yaml`.
# 3. Preenche os dados abaixo (em `image:` e `gallery:` basta escrever o nome
#    do ficheiro de imagem que puseste na pasta, ex: `"capa.png"`).
# =============================================================================

id: meu_novo_projeto          # Identificador único para o URL (/projects/meu_novo_projeto)
order: 8                      # Ordem em que aparece na grelha (1, 2, 3...)
category: Web                 # "Web" ou "Mobile"
tier: field                   # "field" (Aplicado no Terreno) ou "lab" (Estudo & Lab)
year: "2026"

tags:
  - Python
  - Django
  - React

# Links do projeto (usa "#" se não tiver link público ainda)
href: "https://github.com/Vivaldo-Roque/meu-novo-projeto"
liveUrl: "https://meu-novo-projeto.com"

# Imagens colocadas dentro desta mesma subpasta do projeto (basta o nome do ficheiro!)
image: "capa.png"
gallery:
  - "capa.png"
  - "ecra_2.png"

# Textos em Português
pt:
  name: "Nome do Projeto em Português"
  description: |-
    Escreve aqui a descrição do projeto em Português.
    Como estamos a usar "|-" do YAML, podes escrever várias linhas livremente.

  # (OPCIONAL) Se quiseres personalizar os textos ou imagens das 4 cenas do Showcase:
  # scenes:
  #   - eyebrow: "Problema"
  #     title: "O desafio que resolvi"
  #     body: "Explicação detalhada do problema..."
  #     image: "captura_cena_1.png"
  #   - eyebrow: "Stack"
  #     title: "Arquitetura escolhida"
  #     body: "Por que escolhi estas tecnologias..."
  #     image: "captura_cena_2.png"

# Textos em Inglês
en:
  name: "Project Name in English"
  description: |-
    Write your project description in English here.
